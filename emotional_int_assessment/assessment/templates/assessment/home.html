{% extends 'base.html' %}
{% block title %}Home{% endblock %}
{% block content %}

<div class="flex flex-col items-center justify-center h-full bg-gradient-to-br from-indigo-50 to-purple-100 px-4">

    <p class="pt-4 pb-8 max-w-4xl text-center text-lg md:text-xl font-medium text-gray-700 mb-8">
        Discover your emotional intelligence profile through our
        <span class="text-indigo-600 font-semibold">AI-powered scenario analysis</span>.
        <br class="hidden sm:block">
        Please provide a few basic details to generate a personalized assessment for you.
    </p>

    <form action="/assessment/" method="post"
        class="max-w-2xl w-full bg-white rounded-xl shadow-lg p-6 border border-gray-200">

        {% csrf_token %}

        <div class="mb-4">
            <label for="age" class="block mb-1.5 text-sm font-medium text-gray-700">
                Age
            </label>
            <input type="number" id="age" name="age" required min="18" max="100" placeholder="e.g. 30"
                class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-800
                       placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div class="mb-4">
            <label for="gender" class="block mb-1.5 text-sm font-medium text-gray-700">
                Gender
            </label>
            <select id="gender" name="gender" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-800
                       bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="" disabled selected>Select your gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Non-binary">Non-binary</option>
                <option value="Prefer not to say">Prefer not to say</option>
            </select>
        </div>

        <div class="mb-6">
            <label for="profession" class="block mb-1.5 text-sm font-medium text-gray-700">
                Profession
            </label>
            <input type="text" id="profession" name="profession" required
                placeholder="e.g. Software Engineer, Nurse, Manager"
                class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-800
                       placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <button type="submit" class="w-full rounded-lg bg-indigo-600 text-white font-medium py-2.5
                   hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition">
            Start Assessment →
        </button>

    </form>

</div>

{% endblock %}
