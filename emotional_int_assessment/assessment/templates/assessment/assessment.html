{% extends 'base.html' %}
{% block title %}Assessment{% endblock %}

{% block content %}

<div class="mt-6 flex items-center justify-center h-full bg-gradient-to-br from-indigo-50 to-purple-100 px-4">
    <div class="max-w-6xl w-full bg-white rounded-xl shadow-lg border border-gray-200 p-6">

        <div class="mb-6 grid grid-cols-1 sm:grid-cols-3 gap-4 bg-indigo-50 border border-indigo-200 rounded-lg p-4">

            <div class="text-center sm:text-left">
                <p class="text-xs uppercase tracking-wide text-indigo-600 font-semibold">
                    Age
                </p>
                <p class="text-sm font-medium text-gray-800">
                    {{ profile.age }}
                </p>
            </div>

            <div class="text-center sm:text-left">
                <p class="text-xs uppercase tracking-wide text-indigo-600 font-semibold">
                    Gender
                </p>
                <p class="text-sm font-medium text-gray-800">
                    {{ profile.gender }}
                </p>
            </div>

            <div class="text-center sm:text-left">
                <p class="text-xs uppercase tracking-wide text-indigo-600 font-semibold">
                    Profession
                </p>
                <p class="text-sm font-medium text-gray-800">
                    {{ profile.profession }}
                </p>
            </div>

        </div>

        <div class="mb-8 border-b border-gray-200 pb-4">
            <span class="block text-xs font-semibold uppercase tracking-wider text-indigo-600">
                Scenario
            </span>
            <p class="mt-2 text-lg text-gray-800 leading-relaxed">
                {{ scenario }}
            </p>
        </div>

        <form action="{% url 'result' %}" method="post">
            {% csrf_token %}

            {% for question in questions %}
            <div class="mb-6">
                <label for="question_{{ forloop.counter }}" class="block mb-2 text-sm font-semibold text-gray-700">
                    {{ forloop.counter }}. {{ question }}
                </label>

                <textarea id="question_{{ forloop.counter }}" name="response_{{ forloop.counter }}" rows="1" required
                    placeholder="Type your response here..."
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm text-gray-800
                           placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-none"></textarea>

            </div>
            {% endfor %}

            <button type="submit" class="w-full mt-4 rounded-lg bg-indigo-600 text-white font-medium py-2.5
                       hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition">
                Submit Responses
            </button>
        </form>

    </div>
</div>

{% endblock %}
