{% extends 'base.html' %}

{% block content %}

<div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-indigo-50 to-purple-100 px-4">

    <p class="pt-4 pb-8 max-w-4xl text-center text-lg md:text-xl font-medium text-gray-700">
        Here’s a detailed overview of your
        <span class="text-indigo-600 font-semibold">Emotional Intelligence Assessment</span>.
        <br class="hidden sm:block">
        Explore your strengths across key emotional dimensions.
    </p>

    <div class="max-w-3xl w-full bg-white rounded-xl shadow-lg p-6 md:p-8 border border-gray-200">

        <div class="text-center mb-8">
            <h2 class="text-2xl md:text-3xl font-semibold text-indigo-700 mb-2">
                Assessment Results
            </h2>

            <div class="text-5xl md:text-6xl font-bold text-gray-900">
                {{ overall_score }}
                <span class="text-xl text-gray-400">/100</span>
            </div>

            <p class="mt-4 text-lg font-medium text-indigo-600">
                {{ feedback }}
            </p>
        </div>

        <div class="relative w-full h-72 md:h-96">
            <canvas id="eqChart"></canvas>
        </div>

        <div class="mt-8 text-center">
            <a href="{% url 'home' %}" rel="noopener noreferrer">
                <button class="inline-flex items-center rounded-lg bg-indigo-600 text-white font-medium px-6 py-2.5
                           hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-300 transition">
                    Take Assessment Again
                </button>
            </a>
        </div>

    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{{ categories|json_script:"categories-data" }}

<script>
    const categoriesData = JSON.parse(
        document.getElementById('categories-data').textContent
    );

    const ctx = document.getElementById('eqChart').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: Object.keys(categoriesData),
            datasets: [{
                label: 'EQ Score',
                data: Object.values(categoriesData),
                backgroundColor: [
                    'rgba(79, 70, 229, 0.7)',
                    'rgba(236, 72, 153, 0.7)',
                    'rgba(16, 185, 129, 0.7)',
                    'rgba(245, 158, 11, 0.7)',
                    'rgba(99, 102, 241, 0.7)'
                ],
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100,
                    ticks: {
                        stepSize: 20
                    }
                }
            },
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });
</script>

{% endblock %}
